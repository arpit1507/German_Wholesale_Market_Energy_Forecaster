[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "energy_forecast"
version = "0.1.0"
authors = [{ name = "Arpit Agrawal" }]
description = "Production ML framework for wholesale electricity price anomaly forecasting"
readme = "README.md"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py310"